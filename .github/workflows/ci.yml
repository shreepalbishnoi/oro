name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: oro
          POSTGRES_PASSWORD: oro
          POSTGRES_DB: oro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oro -d oro_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://oro:oro@localhost:5432/oro_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      # No paid or free LLM calls in CI: tests use LLM_MODE=off and scripted providers.
      - run: pytest -q
      - run: alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://oro:oro@localhost:5432/oro_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Route types (PageProps, LayoutProps) are generated, not committed.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
