# Always pass the root .env so ${...} values below resolve (compose reads .env next to this file otherwise):
# Local dev:   docker compose --env-file .env -f infra/docker-compose.yml up -d --build
# Low-RAM PC:  add `-f infra/docker-compose.lite.yml`
# Production:  add `--profile prod` (Caddy terminates TLS for SITE_DOMAIN) on the server.
# Memory limits follow PLAN §6.3 (Oracle Always Free A1: 2 OCPU / 12 GB).
name: oro

x-backend: &backend
  # One image for api, pipeline, worker, beat and migrate (built once, reused).
  image: oro/backend:local
  build:
    context: ../backend
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql+asyncpg://oro:${POSTGRES_PASSWORD:-oro}@db:5432/oro
    REDIS_URL: redis://redis:6379/0
    EMBED_URL: http://embedder:8001
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    # Official Postgres 17 + pgvector (HNSW). Lexical search uses built-in full-text search.
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: oro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oro}
      POSTGRES_DB: oro
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c max_connections=80
      -c idle_in_transaction_session_timeout=60s
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oro -d oro"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine
    # AOF so queued work and feeds survive restarts; noeviction because streams are work queues.
    command: redis-server --appendonly yes --maxmemory 450mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: alembic upgrade head
    healthcheck:
      disable: true  # the image's check probes the API port
    restart: "no"

  embedder:
    <<: *backend
    image: oro/embedder:local
    build:
      context: ../backend
      args:
        EXTRAS: embed
    command: uvicorn app.embed.service:app --host 0.0.0.0 --port 8001
    volumes:
      - models:/models
    mem_limit: 1792m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2).status==200 else 1)"]
      interval: 20s
      timeout: 3s
      start_period: 180s  # first start downloads the model (~1.2 GB) into the volume
      retries: 5

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 600m

  pipeline:
    <<: *backend
    command: python -m app.pipeline.service
    healthcheck:
      disable: true  # the image's check probes the API port
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 400m

  worker:
    <<: *backend
    command: celery -A app.worker worker -l info --concurrency 2
    healthcheck:
      disable: true  # the image's check probes the API port
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 600m

  beat:
    <<: *backend
    command: celery -A app.worker beat -l info --schedule /tmp/celerybeat-schedule
    healthcheck:
      disable: true  # the image's check probes the API port
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 200m

  web:
    image: oro/web:local
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    environment:
      API_INTERNAL_URL: http://api:8000
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      AUTH_DATABASE_URL: postgres://oro:${POSTGRES_PASSWORD:-oro}@db:5432/oro_auth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 512m
    restart: unless-stopped

  caddy:
    image: oro/caddy:local
    build:
      context: ./caddy
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - web
    mem_limit: 200m
    restart: unless-stopped

  # Alternative to Caddy: a Cloudflare Tunnel (outbound only; no open ports, no public IP needed,
  # Cloudflare handles TLS). Create the tunnel in Cloudflare Zero Trust → Networks → Tunnels,
  # add a public hostname <domain> → http://web:3000, put its token in CLOUDFLARE_TUNNEL_TOKEN.
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    mem_limit: 128m
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
  models:
